<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Rijan Poudel — Student developer from Nepal</title>
<desc id="desc">Purple animated developer banner with a glowing grid, code panel and creative technology theme.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10091f"/><stop offset=".55" stop-color="#21103d"/><stop offset="1" stop-color="#090d1b"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#c084fc"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#a855f7" stop-opacity=".35"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#c4b5fd" stroke-opacity=".08"/></pattern>
  <clipPath id="clip"><rect width="1200" height="440" rx="24"/></clipPath>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{50%{opacity:0}}
@keyframes dash{to{stroke-dashoffset:-120}}
.glow{animation:pulse 5s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}.cursor{animation:blink 1s steps(2) infinite}.trace{animation:dash 8s linear infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#clip)">
<rect width="1200" height="440" fill="url(#bg)"/><rect width="1200" height="440" fill="url(#grid)"/>
<ellipse class="glow" cx="950" cy="180" rx="370" ry="280" fill="url(#glow)"/>
<path d="M0 365L180 290 300 360 470 245 610 365 760 270 930 380 1080 275 1200 340V440H0Z" fill="#160e2c" opacity=".7"/>
<path d="M52 48H1148" stroke="#594078" opacity=".7"/>
<circle cx="65" cy="78" r="5" fill="#c084fc"/>
<text x="84" y="85" fill="#e9d5ff" font-size="19" font-weight="700" letter-spacing="3">RIJAN POUDEL</text>
<text x="1145" y="83" text-anchor="end" fill="#b9a1d7" class="mono" font-size="13" letter-spacing="2">NEPAL / STUDENT DEVELOPER</text>
<text x="62" y="185" fill="#fff" font-size="66" font-weight="700" letter-spacing="-2">Curiosity into code.</text>
<text x="64" y="254" fill="url(#accent)" font-size="58" font-weight="700" letter-spacing="-1.5">Ideas into projects.</text>
<text x="66" y="300" fill="#c4b5d9" font-size="19">Exploring Python, web development, AI and creative technology.</text>
<rect x="62" y="330" width="660" height="58" rx="11" fill="#0b0717" stroke="#68449a"/>
<text x="82" y="366" fill="#c084fc" class="mono" font-size="20">&gt;</text>
<text x="112" y="366" fill="#eee5ff" class="mono" font-size="18">learn()</text>
<text x="190" y="366" fill="#a78bfa" class="mono" font-size="18"> . build() . improve()</text>
<path class="cursor" d="M466 348V372" stroke="#e9d5ff" stroke-width="2"/>
<g class="float" transform="translate(790 125)">
<rect width="340" height="208" rx="16" fill="#100b20" stroke="#7850a8" stroke-width="1.5"/>
<path d="M0 39H340" stroke="#49305f"/>
<circle cx="20" cy="20" r="4" fill="#c084fc"/><circle cx="36" cy="20" r="4" fill="#a78bfa"/><circle cx="52" cy="20" r="4" fill="#7c3aed"/>
<text x="318" y="24" text-anchor="end" fill="#a78bfa" font-size="11" class="mono">project.py</text>
<text x="24" y="77" fill="#c084fc" class="mono" font-size="17">def <tspan fill="#f5eaff">keep_building():</tspan></text>
<text x="43" y="111" fill="#c4b5d9" class="mono" font-size="15">skills = ["Python", "AI"]</text>
<text x="43" y="143" fill="#c4b5d9" class="mono" font-size="15">ideas = "make them real"</text>
<text x="24" y="180" fill="#e9d5ff" class="mono" font-size="16">return progress <tspan fill="#c084fc">++</tspan></text>
<path class="trace" d="M24 194H314" stroke="#a855f7" stroke-width="2" stroke-dasharray="22 12" fill="none"/>
</g>
<text x="64" y="418" fill="#9f87bc" font-size="12" letter-spacing="2" class="mono">LEARN / EXPERIMENT / CREATE</text>
<rect x=".5" y=".5" width="1199" height="439" rx="24" fill="none" stroke="#68449a"/>
</g></svg>